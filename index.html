<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLSC Agent Lab — Theme Reveal</title>
<style>
  :root{
    --ink:#eaf5ff; --deep1:#030611; --deep2:#111b3b; --glow:#72e5ff; --warn:#ff6d8a; --gold:#ffcf70;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  html,body{height:100%; margin:0; background:var(--deep1); overflow:hidden; font-family:'Courier New',monospace;}
  #stage{position:relative; width:100%; height:100%;}
  canvas{position:absolute; top:0; left:0; width:100%; height:100%;}
  #world3d{z-index:2; pointer-events:none;}
  #scene{z-index:1;}
  #video{display:none;}
  .hud{position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); left:16px; color:var(--glow);
       font-size:12px; line-height:1.6; letter-spacing:1px; text-shadow:0 0 6px var(--glow); z-index:5; max-width:60vw;}
  .hud .line{opacity:0; animation:fadein .4s forwards;}
  #startOverlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
       background:radial-gradient(ellipse at 50% 48%, #172a52 0%, #081226 40%, #02040c 82%); color:var(--ink); z-index:20; text-align:center; padding:24px;}
  #startOverlay h1{font-size:clamp(20px,4vw,32px); letter-spacing:3px; color:var(--glow); text-shadow:0 0 12px var(--glow);}
  #startOverlay p{max-width:480px; opacity:.8; font-size:14px;}
  #startBtn{margin-top:18px; padding:14px 28px; font-size:15px; letter-spacing:2px; color:var(--deep1); background:var(--glow);
       border:none; border-radius:30px; cursor:pointer; box-shadow:0 0 24px var(--glow);}
  #startBtn:active{transform:scale(.97);}
  #err{color:var(--warn); font-size:13px; margin-top:12px; max-width:480px;}
  #reveal{position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; flex-direction:column; padding-bottom:8vh;
       pointer-events:none; z-index:6; opacity:0; background:radial-gradient(ellipse at center,rgba(9,18,47,.12),rgba(2,4,12,.5));}
  #reveal .reveal-kicker{font-size:clamp(10px,1.35vw,15px); letter-spacing:.42em; color:#9df1ff; opacity:0; transform:translateY(14px);}
  #reveal h1{font-size:clamp(40px,10vw,112px); letter-spacing:.12em; color:#fff; text-shadow:0 0 18px #83eaff,0 0 54px #558aff;
       margin:.12em 0; opacity:0; transform:scale(.78);}
  #reveal.active .reveal-kicker{animation:revealUp .7s .25s forwards;}
  #reveal.active h1{animation:titleArrive 1.25s .55s cubic-bezier(.16,1,.3,1) forwards;}
  #reveal.active:before,#reveal.active:after{content:""; position:absolute; top:50%; left:50%; width:min(66vw,620px); aspect-ratio:1; border:1px solid rgba(111,223,255,.28); border-radius:50%; animation:revealRing 3.2s ease-out infinite;}
  #reveal.active:after{animation-delay:1.1s;}
  .activation-status{position:absolute; z-index:5; top:calc(11vh + env(safe-area-inset-top,0px)); left:50%; transform:translate(-50%,-8px);
       width:min(24rem,72vw); padding:.65rem .9rem .75rem; color:#c9f6ff; text-align:center; font-size:clamp(10px,1.4vw,14px);
       letter-spacing:.2em; background:rgba(7,15,31,.78); border:1px solid rgba(105,225,255,.42); border-radius:10px;
       box-shadow:0 0 28px rgba(51,177,255,.15); opacity:0; pointer-events:none; transition:opacity .35s,transform .35s;}
  .activation-status.active{opacity:1; transform:translate(-50%,0);}
  .activation-track{height:3px; margin-top:.6rem; overflow:hidden; background:rgba(143,208,255,.16); border-radius:99px;}
  .activation-progress{height:100%; width:0; background:linear-gradient(90deg,#56caff,#b28aff,#ffd278); box-shadow:0 0 12px #68dfff; transition:width .12s linear;}
  @keyframes revealUp{to{opacity:1;transform:translateY(0);}}
  @keyframes titleArrive{to{opacity:1;transform:scale(1);}}
  @keyframes revealRing{from{opacity:0;transform:translate(-50%,-50%) scale(.56)}30%{opacity:.65}to{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
  @keyframes fadein{to{opacity:1;}}
  .badge{position:absolute; bottom:calc(14px + env(safe-area-inset-bottom,0px)); left:16px; right:16px; z-index:5;
       color:#8bbddc; font-size:11px; opacity:.72; text-align:center;}
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>
  <canvas id="scene"></canvas>
  <canvas id="world3d"></canvas>
  <div class="hud" id="hud"></div>
  <div id="activationStatus" class="activation-status" role="status" aria-live="polite">ACTIVATING AGENT<div class="activation-track"><div id="activationProgress" class="activation-progress"></div></div></div>
  <div id="reveal"><span class="reveal-kicker">MLSC PRESENTS · AUTONOMOUS SYSTEMS</span><h1>AGENTIC AI</h1></div>
  <div class="badge"></div>
  <div id="startOverlay">
    <h1>🐈‍⬛✦ MLSC AGENT LAB</h1>
    <p>Allow camera access. Wave at the screen to wake the agent, then point, show an open palm, or pinch to guide its sensor field.
       Raise both hands together to trigger activation.</p>
    <button id="startBtn">ACTIVATE SENSOR</button>
    <div id="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" crossorigin="anonymous"></script>
<script>
// ---------- DOM references ----------
const video = document.getElementById('video');
const canvas = document.getElementById('scene');
const worldCanvas = document.getElementById('world3d');
const ctx = canvas.getContext('2d');
const hudEl = document.getElementById('hud');
const revealEl = document.getElementById('reveal');
const activationEl = document.getElementById('activationStatus');
const activationProgressEl = document.getElementById('activationProgress');
let W=0,H=0;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
addEventListener('resize', resize); resize();

// ---------- app state ----------
const S = {
  stage: 'standby', // standby -> idle -> awake -> activating -> revealed -> celebrating
  agentCore: 0,
  used: {point:false, palm:false, pinch:false},
  handsNow: [],
  twoHandStart: 0,
  wristHist: [],
  waveCooldown: 0,
  pointTarget: null,
  scanPulse: 0,
  pinchOffset: {x:0,y:0},
  pinchActive: false,
  lastPinch: null,
  transformT: 0,
  celebrate: 0,
  humanCount: 0,
  hudLines: [],
};

// ---------- Three.js cat billboard ----------
let threeRenderer, threeScene, threeCamera, catRig, catHead, catTorso, catTail, catPortrait, catLift=0;
let catArms=[], catLegs=[], catPupils=[], catEars=[];
let eyeTarget={x:0,y:0}, earWiggle=0;
addEventListener('resize', resizeCat3D);

function initCat3D(){
  if(threeRenderer) return;
  if(!window.THREE) throw new Error('The 3D renderer did not load. Check the internet connection and reload.');
  const T=window.THREE;

  // --- Renderer setup ---
  threeRenderer=new T.WebGLRenderer({canvas:worldCanvas,alpha:true,antialias:true,powerPreference:'high-performance'});
  threeRenderer.setClearColor(0x000000,0);
  threeRenderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
  threeRenderer.setSize(W,H,false);
  threeRenderer.outputColorSpace=T.SRGBColorSpace;

  threeScene=new T.Scene();
  threeCamera=new T.PerspectiveCamera(34,W/H,.1,100);
  threeCamera.position.set(0,.22,9.6); threeCamera.lookAt(0,.34,0);

  // --- Lighting ---
  threeScene.add(new T.HemisphereLight(0xb9eaff,0x11172f,2.05));
  const key=new T.DirectionalLight(0xf0f8ff,3.2); key.position.set(-3,5,6); threeScene.add(key);
  const rim=new T.PointLight(0x47cbff,28,14); rim.position.set(3,2.5,-1.5); threeScene.add(rim);
  const warm=new T.PointLight(0x9574ff,12,12); warm.position.set(-4,-.5,2); threeScene.add(warm);

  // --- Cat rig (empty group, only used for transforms) ---
  catRig=new T.Group(); threeScene.add(catRig);
  catHead=new T.Group(); catRig.add(catHead);
  catTorso=new T.Group(); catRig.add(catTorso);
  catTail=new T.Group(); catRig.add(catTail);

  // --- Floor glow under the cat ---
  const floorGlow=new T.Mesh(new T.CircleGeometry(1.15,48),new T.MeshBasicMaterial({color:0x4bcaff,transparent:true,opacity:.1,depthWrite:false}));
  floorGlow.rotation.x=-Math.PI/2; floorGlow.position.set(0,-1.25,.1); floorGlow.scale.set(1.3,.62,1); threeScene.add(floorGlow);

  // --- Cat portrait billboard (Cat1.png is 832×1294, aspect ratio ~0.643) ---
  // CHANGE IMAGE: replace './assets/Cat1.png' with your image path
  const catTexture=new T.TextureLoader().load('./assets/Cat1.png');
  catTexture.colorSpace=T.SRGBColorSpace;
  const portraitMaterial=new T.MeshBasicMaterial({map:catTexture,transparent:true,alphaTest:.025,side:T.DoubleSide,depthWrite:false});
  // CAT SIZE: PlaneGeometry(width, height) — width=2.4, height=3.73 matches the actual image ratio
  catPortrait=new T.Mesh(new T.PlaneGeometry(2.4,3.73),portraitMaterial);
  // CAT POSITION: set(x, y, z) — increase y to move up, decrease to move down
  catPortrait.position.set(0,-0.2,.9);
  catRig.add(catPortrait);
}

function resizeCat3D(){
  if(!threeRenderer||!threeCamera) return;
  threeCamera.aspect=W/H; threeCamera.updateProjectionMatrix(); threeRenderer.setSize(W,H,false);
}

function renderCat3D(t,dt){
  if(!threeRenderer||!catRig) return;
  const dancing=S.stage==='celebrating', revealing=S.stage==='activating'||S.stage==='revealed';
  // VERTICAL BOUNCE: adjust amplitude to control bobbing (set to 0 for no bounce)
  const idleBounce=.008*Math.sin(t*2.0);
  const danceBounce=dancing ? .035*Math.abs(Math.sin(t*5.4)) : 0;
  const targetLift=S.stage==='activating' ? .45 : ((S.stage==='revealed'||dancing) ? .72 : 0);
  catLift+=(targetLift-catLift)*Math.min(1,dt*2.6);
  catRig.position.y=idleBounce+danceBounce+catLift;
  catRig.rotation.y+=(eyeTarget.x*.18-catRig.rotation.y)*.04;
  if(catPortrait){
    catPortrait.scale.y=1+.003*Math.sin(t*2.0)+(dancing ? .01*Math.sin(t*7) : 0);
    catPortrait.rotation.z=dancing ? .018*Math.sin(t*7) : .006*Math.sin(t*1.7);
  }
  threeRenderer.render(threeScene,threeCamera);
}

// ---------- HUD text ----------
function setHud(lines){
  S.hudLines = lines;
  hudEl.innerHTML = lines.map((l,i)=>`<span class="line" style="animation-delay:${i*90}ms">${l}</span>`).join('<br>');
}

// ---------- particles ----------
function rnd(a,b){return a+Math.random()*(b-a);}
const stars = Array.from({length:150},()=>({x:rnd(0,1),y:rnd(0,1),r:rnd(0.5,2.1),a:rnd(0.2,0.9),phase:rnd(0,7)}));
const debris = Array.from({length:22},()=>({x:rnd(0,1),y:rnd(0,1),r:rnd(1.5,4),v:rnd(2,12),phase:rnd(0,7)}));
let confetti = [];

function triggerRevealParty(){
  const colors=['#55e2ff','#b19aff','#ffd278','#ff7fa6','#eaf8ff'];
  [W*.12,W*.88].forEach((origin,side)=>{
    for(let i=0;i<48;i++) confetti.push({x:origin,y:H*.68,vx:rnd(side===0?55:-250,side===0?250:-55),vy:rnd(-520,-180),gravity:rnd(360,640),r:rnd(4,9),rotation:rnd(0,Math.PI*2),spin:rnd(-8,8),c:colors[Math.floor(Math.random()*colors.length)]});
  });
}

// ---------- background drawing ----------
function drawBackground(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#101a32'); g.addColorStop(0.48,'#080f22'); g.addColorStop(1,'#030611');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const pulse=.5+.5*Math.sin(t*.42);
  [[.5,.46,'54,147,210',.34],[.18,.58,'93,91,183',.12],[.82,.55,'46,190,207',.13]].forEach(([x,y,rgb,alpha],i)=>{
    const radius=Math.max(W,H)*(i===0 ? .68 : .48);
    const glow=ctx.createRadialGradient(W*x,H*y,0,W*x,H*y,radius);
    glow.addColorStop(0,`rgba(${rgb},${alpha*(i===0 ? .92+.08*pulse : 1)})`);
    glow.addColorStop(1,'rgba(8,14,25,0)');
    ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
  });
  ctx.save();
  ctx.strokeStyle=`rgba(91,194,255,${.035+.018*pulse})`; ctx.lineWidth=1;
  for(let i=0;i<3;i++){
    const radius=Math.min(W,H)*(.32+i*.105), wobble=Math.sin(t*.18+i)*.04;
    ctx.beginPath(); ctx.ellipse(W*.5,H*.45,radius*(1.22+wobble),radius*(.38+wobble),0,Math.PI*1.08,Math.PI*1.92); ctx.stroke();
  }
  ctx.restore();
  // Perspective floor grid
  const horizon=H*.72;
  ctx.strokeStyle='rgba(92,191,235,.09)'; ctx.lineWidth=1;
  for(let i=-8;i<=8;i++){
    ctx.beginPath(); ctx.moveTo(W*.5+i*W*.012,horizon); ctx.lineTo(W*.5+i*W*.11,H); ctx.stroke();
  }
  for(let i=0;i<7;i++){
    const p=i/6, y=horizon+(H-horizon)*p*p;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  stars.forEach(s=>{
    const twinkle=0.35+0.65*(0.5+0.5*Math.sin(t*1.6+s.phase));
    ctx.globalAlpha=s.a*twinkle; ctx.fillStyle='#d9f4ff';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawLabGrid(dt, ox, oy, t){
  const cx=W*.5+ox*W*.08, cy=H*.65+oy*H*.08;
  const radius=Math.min(W,H)*.3;
  ctx.save(); ctx.translate(cx,cy);
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.strokeStyle=`rgba(100,215,255,${.22-i*.04})`; ctx.lineWidth=i===0?2:1;
    ctx.ellipse(0,0,radius*(.7+i*.27),radius*(.22+i*.08),0,0,Math.PI*2); ctx.stroke();
  }
  ctx.strokeStyle='rgba(104,207,246,.16)'; ctx.setLineDash([3,10]);
  for(let i=0;i<16;i++){
    const a=i*Math.PI/8+t*.04;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*radius*.72,Math.sin(a)*radius*.23); ctx.lineTo(Math.cos(a)*radius*1.55,Math.sin(a)*radius*.49); ctx.stroke();
  }
  ctx.setLineDash([]); ctx.restore();

  debris.forEach(d=>{
    d.phase+=dt*d.v*.025;
    const x=((d.x+ox*.34+Math.cos(d.phase)*.006)%1+1)%1*W;
    const y=((d.y+oy*.3+Math.sin(d.phase)*.006)%1+1)%1*H;
    ctx.fillStyle='rgba(155,211,235,.48)'; ctx.fillRect(x,y,d.r,d.r);
  });
}

function drawStation(t){
  const x=W*.5, y=H*.58, r=Math.min(W,H)*.26;
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(t*.18)*.015);
  ctx.strokeStyle='rgba(123,222,255,.24)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,r*1.85,Math.PI*.08,Math.PI*.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,r*1.85,Math.PI*1.08,Math.PI*1.92); ctx.stroke();
  for(let side of [-1,1]){
    ctx.save(); ctx.scale(side,1);
    ctx.fillStyle='rgba(15,30,53,.72)'; ctx.strokeStyle='rgba(114,229,255,.38)';
    ctx.beginPath(); ctx.roundRect(r*1.18,-r*.25,r*.64,r*.5,8); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(100,215,255,.68)';
    for(let i=0;i<3;i++){ctx.fillRect(r*1.3+i*r*.16,-r*.06,r*.08,r*.12);}
    ctx.restore();
  }
  ctx.restore();
}

function drawScan(t){
  if(S.scanPulse<=0) return;
  const cx=W/2, cy=H*0.58;
  const p = 1-S.scanPulse;
  ctx.beginPath();
  ctx.strokeStyle = `rgba(114,229,255,${S.scanPulse})`;
  ctx.lineWidth=2;
  ctx.arc(cx,cy, p*Math.max(W,H)*0.7, 0,7); ctx.stroke();
  S.scanPulse -= 0.012;
}

function drawTargetBeam(){
  if(S.stage!=='awake' || !S.pointTarget) return;
  const cx=W/2, cy=H*0.58;
  const tx = S.pointTarget.x*W, ty = S.pointTarget.y*H;
  ctx.strokeStyle='rgba(255,207,112,0.72)'; ctx.lineWidth=1.5; ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(tx,ty); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.fillStyle='#ffcf70'; ctx.arc(tx,ty,5,0,7); ctx.fill();
}

function drawTransform(dt){
  S.transformT += dt;
  const cx=W/2, cy=H*0.58;
  const nodes = ['PERCEIVE','REASON','PLAN','ACT'];
  ctx.font = '13px Courier New';
  nodes.forEach((n,i)=>{
    const ang = (S.transformT*0.8 + i*(Math.PI/2));
    const rad = Math.min(W,H)*0.28;
    const nx = cx+Math.cos(ang)*rad, ny=cy+Math.sin(ang)*rad*0.6;
    const lit = S.transformT > i*0.8;
    ctx.beginPath(); ctx.fillStyle = lit? '#ffcf70':'#354261';
    ctx.arc(nx,ny,6,0,7); ctx.fill();
    ctx.fillStyle = lit? '#ffcf70':'#586785';
    ctx.fillText(n, nx-24, ny-12);
  });
}

function drawConfetti(dt){
  if(confetti.length<80 && S.stage==='celebrating') {
    for(let i=0;i<3;i++) confetti.push({x:rnd(0,W),y:-10,vy:rnd(60,160),vx:rnd(-40,40),gravity:20,r:rnd(3,7),rotation:rnd(0,Math.PI*2),spin:rnd(-5,5),c:`hsl(${rnd(175,320)},90%,68%)`});
  }
  confetti.forEach(c=>{ c.vy+=(c.gravity||0)*dt; c.y+=c.vy*dt; c.x+=c.vx*dt; c.rotation+=(c.spin||0)*dt; ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rotation||0); ctx.fillStyle=c.c; ctx.fillRect(-c.r/2,-c.r,c.r,c.r*1.8); ctx.restore(); });
  confetti = confetti.filter(c=>c.y<H+20);
}

// ---------- gesture detection ----------
function fingerUp(lm, tip, pip){ return lm[tip].y < lm[pip].y - 0.02; }
function isOpenPalm(lm){
  return fingerUp(lm,8,6) && fingerUp(lm,12,10) && fingerUp(lm,16,14) && fingerUp(lm,20,18);
}
function isPoint(lm){
  return fingerUp(lm,8,6) && !fingerUp(lm,12,10) && !fingerUp(lm,16,14) && !fingerUp(lm,20,18);
}
function pinchRatio(lm){
  const pinch=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
  const palm=Math.max(Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y),.035);
  return pinch/palm;
}
function hasTwoDistinctHands(results){
  const found=results.multiHandLandmarks||[];
  if(found.length!==2) return false;
  if(found.some(hand=>hand[0].y>.8)) return false;
  const wristGap=Math.hypot(found[0][0].x-found[1][0].x,found[0][0].y-found[1][0].y);
  if(wristGap<.13) return false;
  const labels=(results.multiHandedness||[]).map(item=>item?.classification?.[0]?.label?.toLowerCase()).filter(Boolean);
  return labels.length===0 || (labels.length===2&&labels.includes('left')&&labels.includes('right'));
}

function updateWave(wristX, t){
  S.wristHist.push({x:wristX,t});
  S.wristHist = S.wristHist.filter(p=>t-p.t<1.0);
  if(S.wristHist.length<6) return false;
  let dirChanges=0, lastDir=0, minX=1,maxX=0;
  for(let i=1;i<S.wristHist.length;i++){
    const d = S.wristHist[i].x - S.wristHist[i-1].x;
    const dir = d>0.004?1:(d<-0.004?-1:0);
    if(dir!==0 && lastDir!==0 && dir!==lastDir) dirChanges++;
    if(dir!==0) lastDir=dir;
    minX=Math.min(minX,S.wristHist[i].x); maxX=Math.max(maxX,S.wristHist[i].x);
  }
  return dirChanges>=2 && (maxX-minX)>0.12;
}

// ---------- MediaPipe hand tracking ----------
let hands, lastT = performance.now();
function onResults(results){
  const now = performance.now()/1000;
  S.handsNow = results.multiHandLandmarks || [];
  const n = S.handsNow.length;

  if(S.stage==='standby'){
    S.stage='idle';
    setHud(['SYSTEM STATUS: ONLINE','VISUAL SENSOR: ONLINE','AWAITING SIGNAL...']);
  }

  if(n>0){
    const lm = S.handsNow[0];
    // Wave detection (works from idle or awake)
    if(updateWave(lm[0].x, now) && now > S.waveCooldown){
      S.waveCooldown = now + 2.0;
      earWiggle = Math.min(1.5,earWiggle+.8);
      if(S.stage==='idle'){
        S.stage='awake';
        setHud(['UNKNOWN SIGNAL DETECTED','HUMAN PRESENCE DETECTED','AGENT CORE: 10%','→ point / palm / pinch to guide the agent']);
        S.agentCore=10;
      } else if(S.stage==='revealed'){
        S.stage='celebrating';
      }
    }

    if(S.stage==='awake'){
      if(isPoint(lm)){
        S.pointTarget = {x:1-lm[8].x, y:lm[8].y}; // mirror
        eyeTarget = {x:(S.pointTarget.x-0.5)*2, y:(S.pointTarget.y-0.5)*2};
        if(!S.used.point){ S.used.point=true; bumpCore('TARGET ACQUIRED'); }
      } else if(isOpenPalm(lm)){
        if(S.scanPulse<=0) S.scanPulse = 1;
        if(!S.used.palm){ S.used.palm=true; bumpCore('PILOT SIGNAL ANALYZED'); }
      } else {
        eyeTarget = {x:Math.sin(now*0.6)*0.3, y:Math.sin(now*0.4)*0.15};
      }
      const ratio=pinchRatio(lm);
      const pinching=S.pinchActive ? ratio<.62 : ratio<.42;
      if(pinching){
        const midpoint={x:(lm[4].x+lm[8].x)*.5,y:(lm[4].y+lm[8].y)*.5};
        if(S.lastPinch){
          S.pinchOffset.x += (midpoint.x-S.lastPinch.x)*5;
          S.pinchOffset.y += (midpoint.y-S.lastPinch.y)*5;
        }
        S.lastPinch=midpoint;
        S.pinchActive=true;
        if(!S.used.pinch){ S.used.pinch=true; bumpCore('HOLOGRAM FIELD LINKED'); }
      } else { S.lastPinch=null; S.pinchActive=false; }
    }
  } else {
    S.lastPinch=null; S.pinchActive=false;
  }

  // Two-hand activation gesture
  if(S.stage==='awake'){
    if(hasTwoDistinctHands(results)){
      if(!S.twoHandStart) S.twoHandStart = now;
      const held = now - S.twoHandStart;
      setHud([`AWAITING HUMAN INPUT`,`LEFT HAND ✓  RIGHT HAND ✓`,`GESTURE: ACTIVATION (${Math.min(100,Math.round(held/1.0*100))}%)`]);
      if(held > 1.0){
        S.stage='activating'; S.transformT=0;
        activationEl.classList.add('active');
        setHud(['HANDS DETECTED','PERCEIVING...','REASONING...','PLANNING...','ACTING...']);
      }
    } else {
      S.twoHandStart = 0;
      if(n===2) setHud(['TWO HANDS DETECTED','RAISE BOTH HANDS, SPREAD THEM APART, AND HOLD']);
    }
  }
}

function bumpCore(msg){
  const total = Object.values(S.used).filter(Boolean).length;
  S.agentCore = 10 + total*25;
  setHud(['HUMAN PRESENCE DETECTED', msg, `AGENT CORE: ${S.agentCore}%`, '→ raise BOTH hands to activate']);
}

async function initHands(){
  hands = new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.5});
  hands.onResults(onResults);
}

async function detectLoop(){
  if(video.readyState>=2) await hands.send({image:video});
  requestAnimationFrame(detectLoop);
}

// ---------- main render loop ----------
function tick(){
  const now = performance.now()/1000;
  const dt = Math.min(0.05, now-lastT); lastT=now;

  drawBackground(now);
  drawLabGrid(dt, S.pinchOffset.x, S.pinchOffset.y, now);
  drawStation(now);
  drawTargetBeam();
  if(S.stage==='activating'){ drawTransform(dt); }
  renderCat3D(now,dt);
  drawScan(now);

  // Theme reveal trigger
  if(S.stage==='activating' && S.transformT>3.4){
    S.stage='revealed';
    activationEl.classList.remove('active');
    revealEl.style.transition='opacity 1.2s';
    revealEl.style.opacity='1';
    revealEl.classList.add('active');
    triggerRevealParty();
    setHud(['AGENT ONLINE']);
    // Replace cat portrait with hapihapihapi video
    if(catPortrait && threeScene){
      catPortrait.visible=false;
      const hapiVideo=document.createElement('video');
      // CHANGE VIDEO: replace './assets/hapihapihapi.webm' with your video path
      hapiVideo.src='./assets/hapihapihapi.webm';
      hapiVideo.loop=true;
      hapiVideo.muted=true;
      hapiVideo.playsInline=true;
      hapiVideo.play();
      const T=window.THREE;
      const videoTexture=new T.VideoTexture(hapiVideo);
      videoTexture.colorSpace=T.SRGBColorSpace;
      const videoMat=new T.MeshBasicMaterial({map:videoTexture,transparent:true,side:T.DoubleSide,depthWrite:false});
      // VIDEO SIZE: PlaneGeometry(width, height) — adjust to match your video's aspect ratio
      const videoPlane=new T.Mesh(new T.PlaneGeometry(3.57,2.01),videoMat);
      // VIDEO POSITION: set(x, y, z) — increase y to move up, decrease to move down
      videoPlane.position.set(0,-0.2,.9);
      catRig.add(videoPlane);
    }
  }
  if(confetti.length||S.stage==='celebrating') drawConfetti(dt);
  if(S.stage==='activating') activationProgressEl.style.width=`${Math.min(100,Math.round(S.transformT/3.4*100))}%`;
  if(S.stage==='celebrating'){
    S.celebrate += dt;
    const fake = Math.min(32, Math.round(S.celebrate*10));
    setHud(['YOU ACTIVATED ME.', `HUMANS DETECTED: ${String(fake).padStart(2,'0')}`, '✦ MLSC LAB SYSTEM OVERRIDE']);
  }
  requestAnimationFrame(tick);
}

// ---------- start button ----------
document.getElementById('startBtn').addEventListener('click', async ()=>{
  const errEl = document.getElementById('err');
  try{
    if(typeof Hands==='undefined') throw new Error('MediaPipe failed to load. Check the internet connection and reload this page.');
    initCat3D();
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      throw new Error('Camera access needs a secure page. Open http://localhost:8000 (not http://[::]:8000), or use HTTPS.');
    }
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    video.srcObject = stream;
    await video.play();
    await initHands();
    document.getElementById('startOverlay').style.display='none';
    detectLoop();
    tick();
  }catch(e){
    const detail = e instanceof Error ? e.message : String(e);
    errEl.textContent = 'Could not start the experience: '+ detail + ' — use localhost or HTTPS, open the page in its own tab, and allow camera permission.';
  }
});
</script>
